<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for the Notebook Cover -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Drop Shadow Filter for the Pencil -->
    <filter id="pencilShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Notebook Cover (Backing) -->
  <rect x="96" y="64" width="320" height="384" rx="32" fill="url(#coverGrad)" />
  
  <!-- Subtle Spine Crease Highlight -->
  <rect x="116" y="64" width="6" height="384" fill="#FFFFFF" opacity="0.15" />

  <!-- Drop shadow cast by the white paper -->
  <rect x="142" y="82" width="260" height="360" rx="20" fill="#000000" opacity="0.15" />

  <!-- White Paper Page -->
  <rect x="144" y="76" width="260" height="360" rx="20" fill="#FFFFFF" />

  <!-- Pink Bookmark -->
  <path d="M192 76 V 200 L 216 180 L 240 200 V 76 Z" fill="#EC4899" />

  <!-- Text Lines on Paper -->
  <rect x="192" y="240" width="150" height="12" rx="6" fill="#E5E7EB" />
  <rect x="192" y="288" width="150" height="12" rx="6" fill="#E5E7EB" />
  <rect x="192" y="336" width="90" height="12" rx="6" fill="#E5E7EB" />

  <!-- Floating Pencil -->
  <g transform="translate(360, 270) rotate(35)" filter="url(#pencilShadow)">
    <!-- Yellow Pencil Body -->
    <rect x="-20" y="-80" width="40" height="160" rx="4" fill="#FBBF24" />
    <!-- Center Orange Stripe for 3D Effect -->
    <rect x="-10" y="-80" width="20" height="160" fill="#F59E0B" />
    
    <!-- Wooden Tip -->
    <path d="M-20 80 L 0 120 L 20 80 Z" fill="#FDE68A" />
    <!-- Graphite Lead -->
    <path d="M-6 108 L 0 120 L 6 108 Z" fill="#374151" />
    
    <!-- Metal Ferrule -->
    <rect x="-20" y="-100" width="40" height="20" fill="#9CA3AF" />
    
    <!-- Red Eraser -->
    <path d="M-20 -100 V -110 C -20 -115.5 -15.5 -120 -10 -120 H 10 C 15.5 -120 20 -115.5 20 -110 V -100 Z" fill="#F87171" />
  </g>
</svg>
